<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 180" fill="none">
  <!-- Icon mark -->
  <g transform="translate(148, 4)">
    <!-- outer border -->
    <rect x="1" y="1" width="86" height="120" stroke="#1a1918" stroke-width="3" fill="white"/>
    <!-- vertical divider (left of center) -->
    <line x1="38" y1="1" x2="38" y2="121" stroke="#1a1918" stroke-width="2.2"/>
    <!-- horizontal divider ~40% from top -->
    <line x1="1" y1="48" x2="87" y2="48" stroke="#1a1918" stroke-width="2.2"/>
    <!-- top-right: black vertical fill (J crossbar top) -->
    <rect x="60" y="3" width="25" height="43" fill="#1a1918"/>
    <!-- middle-left: black horizontal band (J stem) -->
    <rect x="3" y="50" width="33" height="16" fill="#1a1918"/>
    <!-- lower section: large diagonal fill -->
    <polygon points="3,68 85,68 85,119 3,119" fill="#1a1918"/>
    <!-- diagonal cut from upper-left of lower section -->
    <polygon points="3,68 50,68 3,95" fill="white"/>
  </g>

  <!-- Wordmark: TONITRUUM -->
  <text
    x="220"
    y="158"
    font-family="'Didot','Bodoni MT','Playfair Display','Georgia',serif"
    font-size="40"
    font-weight="700"
    letter-spacing="8"
    text-anchor="middle"
    fill="#1a1918"
  >TONITRUUM</text>
</svg>
